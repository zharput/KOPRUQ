# CI: backend tests, frontend quality gates and Playwright e2e on every push / pull request.
# No GitHub secret is needed: the e2e database password is generated per run and masked.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven

      - name: Maven version
        run: mvn -v

      - name: Build and test
        run: mvn -B -f backend/pom.xml package

      - name: Upload backend jar
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/kopruq-backend-*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_URL: jdbc:postgresql://localhost:5433/kopruq_test
      DB_USERNAME: kopruq
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download backend jar
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: ${{ runner.temp }}/backend-jar

      - name: Generate throwaway database password
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Start PostgreSQL (postgres-test profile)
        run: docker compose --profile postgres-test up -d --wait postgres-test

      - name: Start backend and wait for health
        run: |
          jar=$(ls "$RUNNER_TEMP"/backend-jar/kopruq-backend-*.jar | head -n 1)
          nohup java -jar "$jar" > "$RUNNER_TEMP/backend.log" 2>&1 &
          pid=$!
          echo "backend pid $pid"
          for i in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Backend process exited before becoming healthy" >&2
              tail -n 100 "$RUNNER_TEMP/backend.log" >&2
              exit 1
            fi
            if curl -fsS --max-time 5 http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend is UP"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy within 120 seconds" >&2
          tail -n 100 "$RUNNER_TEMP/backend.log" >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npm run test:e2e:install -- --with-deps

      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Collect PostgreSQL logs
        if: failure()
        run: docker compose --profile postgres-test logs postgres-test > "$RUNNER_TEMP/postgres.log" 2>&1 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload backend and database logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/postgres.log
          if-no-files-found: ignore
          retention-days: 7
