# Test-only overrides (higher precedence than the main application.properties). Tests run on in-memory H2 in
# PostgreSQL mode, so no Docker/PostgreSQL is needed. Set KOPRUQ_TEST_DB_URL (+ _USERNAME/_PASSWORD) to run the very
# same tests against a real PostgreSQL, e.g. the compose "postgres-test" profile (jdbc:postgresql://localhost:5433/kopruq_test).
spring.datasource.url=${KOPRUQ_TEST_DB_URL:jdbc:h2:mem:kopruq;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${KOPRUQ_TEST_DB_USERNAME:sa}
spring.datasource.password=${KOPRUQ_TEST_DB_PASSWORD:}
