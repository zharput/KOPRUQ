spring.application.name=kopruq-api
server.port=8080
management.endpoints.web.exposure.include=health,info

# TERRAIN-P01: a real DTM point file can be tens of MB - Spring Boot's
# multipart defaults (1MB file / 10MB request) are far too small.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Large terrain binary responses may exceed the MVC default timeout.
spring.mvc.async.request-timeout=120000

# BACKEND-REMEDIATION Faz 3: show the request correlation id (set by CorrelationIdFilter) in every log line.
logging.pattern.level=%5p [%X{correlationId:-}]

# BACKEND-REMEDIATION Faz 10: browser origins allowed to call /api/** (comma separated). Default = the Vite dev server.
kopruq.cors.allowed-origins=http://localhost:5173

# Feature "backend": persistence. PostgreSQL via environment variables; no password default on purpose (fail fast,
# nothing secret is committed). See compose.yaml / .env.example. Flyway owns the schema, Hibernate only validates it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kopruq}
spring.datasource.username=${DB_USERNAME:kopruq}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
