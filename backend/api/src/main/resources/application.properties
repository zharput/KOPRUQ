spring.application.name=spanova-api
server.port=8080
management.endpoints.web.exposure.include=health,info

# TERRAIN-P01: a real DTM point file can be tens of MB - Spring Boot's
# multipart defaults (1MB file / 10MB request) are far too small.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Large terrain binary responses may exceed the MVC default timeout.
spring.mvc.async.request-timeout=120000
server.error.include-message=always
